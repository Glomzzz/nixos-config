# DSH does not consume Agent Plugins 1.0 manifests directly. This bundle maps
# OpenViking's official MCP proxy and memory skill onto DSH's native plugins.
- insert:
    - id: openviking-memory-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: openviking
        includeDefaultRoots: false
        customSkillDirs:
          - '@OPENVIKING_SKILLS@'
        watch: false

    - id: openviking-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: openviking
        transport: stdio
        command: '@OPENVIKING_PROXY@'
        env: !!js "Object.fromEntries(['OPENVIKING_URL', 'OPENVIKING_BASE_URL', 'OPENVIKING_API_KEY', 'OPENVIKING_BEARER_TOKEN', 'OPENVIKING_ACCOUNT', 'OPENVIKING_USER', 'OPENVIKING_PEER_ID', 'OPENVIKING_WORKSPACE_PEER', 'OPENVIKING_CONFIG_FILE', 'OPENVIKING_CLI_CONFIG_FILE', 'OPENVIKING_TIMEOUT_MS', 'OPENVIKING_DEBUG', 'OPENVIKING_DEBUG_LOG'].flatMap((name) => process.env[name] === undefined ? [] : [[name, process.env[name]]]))"
        failOnStartupError: false
